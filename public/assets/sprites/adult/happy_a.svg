<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="64" height="64">
  <!-- Mametchi Happy Frame A (Idle base) -->
  <!-- Two iconic tall ears -->
  <rect x="4" y="1" width="2" height="3" fill="#24301f"/>
  <rect x="10" y="1" width="2" height="3" fill="#24301f"/>
  <!-- Head & body -->
  <rect x="3" y="4" width="10" height="2" fill="#24301f"/>
  <rect x="2" y="6" width="12" height="6" fill="#24301f"/>
  <!-- Big round eyes -->
  <rect x="4" y="7" width="2" height="2" fill="#9ead86"/>
  <rect x="10" y="7" width="2" height="2" fill="#9ead86"/>
  <rect x="5" y="8" width="1" height="1" fill="#24301f"/>
  <rect x="11" y="8" width="1" height="1" fill="#24301f"/>
  <!-- Cheerful mouth -->
  <rect x="7" y="10" width="2" height="1" fill="#9ead86"/>
  <!-- Body base -->
  <rect x="3" y="12" width="10" height="1" fill="#24301f"/>
  <!-- Feet -->
  <rect x="4" y="13" width="2" height="2" fill="#24301f"/>
  <rect x="10" y="13" width="2" height="2" fill="#24301f"/>
</svg>
