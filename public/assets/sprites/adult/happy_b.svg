<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" width="64" height="64">
  <!-- Mametchi Happy Frame B (Jump / Bouncing ears) -->
  <!-- Ears spread slightly -->
  <rect x="3" y="0" width="2" height="3" fill="#24301f"/>
  <rect x="11" y="0" width="2" height="3" fill="#24301f"/>
  <!-- Head & body lifted -->
  <rect x="3" y="3" width="10" height="2" fill="#24301f"/>
  <rect x="2" y="5" width="12" height="6" fill="#24301f"/>
  <!-- Happy curved eyes -->
  <rect x="4" y="6" width="3" height="1" fill="#9ead86"/>
  <rect x="9" y="6" width="3" height="1" fill="#9ead86"/>
  <!-- Big open smiling mouth -->
  <rect x="7" y="8" width="2" height="2" fill="#9ead86"/>
  <rect x="3" y="11" width="10" height="1" fill="#24301f"/>
  <!-- Feet kicked up -->
  <rect x="2" y="11" width="2" height="2" fill="#24301f"/>
  <rect x="12" y="11" width="2" height="2" fill="#24301f"/>
</svg>
